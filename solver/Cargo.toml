[package]
name = "leakfinder-solver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "WebAssembly bindings for b-inary's postflop-solver, used by Leakfinder"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Single-threaded build (no rayon): GitHub Pages can't send the COOP/COEP headers needed for wasm threads.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
panic = "abort"
